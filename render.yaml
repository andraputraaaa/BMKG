services:
  - type: web
    name: bmkg-ibf-ews-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 20 --timeout 300 app:app
    healthCheckPath: /
    disk:
      name: bmkg-weather-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BPS_API_KEY
        sync: false
      - key: BMKG_CACHE_FILE
        value: /var/data/bmkg_weather_cache.json
      - key: BMKG_STAGING_CACHE_FILE
        value: /var/data/bmkg_weather_cache.staging.json
